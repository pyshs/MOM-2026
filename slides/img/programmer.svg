<svg xmlns="http://www.w3.org/2000/svg" width="680" height="580" viewBox="0 0 680 580">
  <title>Principe de la programmation</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,400;0,500;1,400&amp;display=swap');
    text { font-family: 'Jost', 'Futura', 'Century Gothic', sans-serif; }
    .titre { font-size: 28px; font-weight: 500; fill: #000; text-anchor: middle; }
    .label { font-size: 14px; font-weight: 500; fill: #000; }
    .item { font-size: 17px; fill: #777; }
    .ex { font-size: 16px; fill: #555; }
  </style>

  <rect x="0" y="0" width="680" height="580" fill="#ffffff"/>

  <!-- Titres -->
  <text class="titre" x="95" y="52">entrées</text>
  <text class="titre" x="340" y="52">programme</text>
  <text class="titre" x="585" y="52">sorties</text>

  <!-- Entrées -->
  <text class="label" x="40" y="108">données</text>
  <text class="item" x="40" y="134">un texte</text>
  <text class="item" x="40" y="159">des nombres</text>
  <text class="item" x="40" y="184">une image</text>
  <text class="label" x="40" y="240">actions</text>
  <text class="item" x="40" y="266">un clic</text>
  <text class="item" x="40" y="291">une touche</text>
  <text class="item" x="40" y="316">un capteur</text>

  <!-- Flèche entrée -->
  <line x1="150" y1="210" x2="222" y2="210" stroke="#999" stroke-width="8"/>
  <polyline points="206,193 226,210 206,227" fill="none" stroke="#999" stroke-width="8"/>

  <!-- Programme -->
  <rect x="236" y="80" width="208" height="232" fill="none" stroke="#999" stroke-width="6"/>
  <text class="item" x="258" y="128">des étapes, dans l'ordre</text>
  <text class="item" x="258" y="174">si… alors…</text>
  <text class="item" x="258" y="220">répéter</text>
  <text class="item" x="258" y="266">mémoriser</text>
  <text x="340" y="338" text-anchor="middle" font-size="14" font-style="italic" fill="#777">l'ordinateur exécute les instructions</text>

  <!-- Flèche sortie -->
  <line x1="452" y1="210" x2="514" y2="210" stroke="#999" stroke-width="8"/>
  <polyline points="498,193 518,210 498,227" fill="none" stroke="#999" stroke-width="8"/>

  <!-- Sorties -->
  <text class="item" x="530" y="134">un résultat</text>
  <text class="item" x="530" y="164">un graphique</text>
  <text class="item" x="530" y="194">un fichier</text>
  <text class="item" x="530" y="240">un mouvement</text>
  <text class="item" x="530" y="270">un son</text>

  <!-- Exemples -->
  <text x="40" y="392" font-size="20" font-weight="500" fill="#000">exemples</text>
  <line x1="40" y1="404" x2="640" y2="404" stroke="#000" stroke-width="1.5"/>

  <text class="ex" x="40" y="432">un texte</text>
  <text class="ex" x="255" y="432">compter les mots</text>
  <text class="ex" x="480" y="432">245 mots</text>

  <text class="ex" x="40" y="467">une photo</text>
  <text class="ex" x="255" y="467">chercher un chat</text>
  <text class="ex" x="480" y="467">chat détecté</text>

  <text class="ex" x="40" y="502">les ventes du mois</text>
  <text class="ex" x="255" y="502">calculer et tracer</text>
  <text class="ex" x="480" y="502">un graphique</text>

  <text class="ex" x="40" y="537">appui sur un bouton</text>
  <text class="ex" x="255" y="537">avancer d'un mètre</text>
  <text class="ex" x="480" y="537">le robot bouge</text>

  <g stroke="#ddd" stroke-width="1">
    <line x1="40" y1="446" x2="640" y2="446"/>
    <line x1="40" y1="481" x2="640" y2="481"/>
    <line x1="40" y1="516" x2="640" y2="516"/>
    <line x1="40" y1="551" x2="640" y2="551"/>
  </g>

  <g stroke="#999" stroke-width="2" fill="none">
    <line x1="205" y1="427" x2="238" y2="427"/><polyline points="232,422 238,427 232,432"/>
    <line x1="430" y1="427" x2="463" y2="427"/><polyline points="457,422 463,427 457,432"/>
    <line x1="205" y1="462" x2="238" y2="462"/><polyline points="232,457 238,462 232,467"/>
    <line x1="430" y1="462" x2="463" y2="462"/><polyline points="457,457 463,462 457,467"/>
    <line x1="205" y1="497" x2="238" y2="497"/><polyline points="232,492 238,497 232,502"/>
    <line x1="430" y1="497" x2="463" y2="497"/><polyline points="457,492 463,497 457,502"/>
    <line x1="205" y1="532" x2="238" y2="532"/><polyline points="232,527 238,532 232,537"/>
    <line x1="430" y1="532" x2="463" y2="532"/><polyline points="457,527 463,532 457,537"/>
  </g>
</svg>